<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#14161A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skallary</title>
    <script>
      // Set the theme before first paint so the page never flashes light then dark.
      // The cached choice is confirmed against the server once the app loads.
      (function () {
        try {
          var t = localStorage.getItem("finance_theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
